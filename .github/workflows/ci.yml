name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Test and validate containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: amail-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AMAIL_BIND_ADDRESS: 127.0.0.1
      AMAIL_PORT: 3080
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests and build checks
        run: |
          npm test
          npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate deployment files
        run: |
          cp .env.example .env
          sh -n deploy/launch.sh
          sh -n deploy/docker-entrypoint.sh
          docker compose --env-file .env --profile privacy config --quiet
          docker compose --env-file .env --profile privacy config --format json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              const service = config.services?.amail;
              const dataMount = service?.volumes?.find((mount) => mount.target === "/data");
              if (!service || dataMount?.type !== "volume" || dataMount.source !== "amail-data" ||
                typeof service.environment?.AMAIL_ENCRYPTION_KEY !== "string") process.exit(1);
            });
          '

      - name: Build application and privacy images
        run: docker compose --env-file .env --profile privacy build

      - name: Start the application image
        run: |
          REMOTE_CONTENT_PROXY_URL=http://tor-proxy:8118 \
            docker compose --env-file .env --profile privacy up --detach --no-build --wait --wait-timeout 300

      - name: Exercise health and authentication gates
        run: |
          health=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3080/api/health)
          printf '%s\n' "$health" | grep -q '"status":"ok"'
          printf '%s\n' "$health" | grep -q '"authProtected":true'
          printf '%s\n' "$health" | grep -q '"credentialsConfigured":true'
          printf '%s\n' "$health" | grep -q '"remoteContentProxyConfigured":true'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1:3080/api/accounts)
          test "$status" = "401"
          # The rebranded stack still boots with a GigaMail-era .env.
          docker compose --env-file .env --profile privacy down --timeout 15
          sed -i 's/^AMAIL_/GIGAMAIL_/' .env
          REMOTE_CONTENT_PROXY_URL=http://tor-proxy:8118 \
            docker compose --env-file .env --profile privacy up --detach --no-build --wait --wait-timeout 300
          legacy=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3080/api/health)
          printf '%s\n' "$legacy" | grep -q '"authProtected":true'
          printf '%s\n' "$legacy" | grep -q '"credentialsConfigured":true'
          docker compose --env-file .env --profile privacy down --timeout 15

      - name: Boot the same image in hosted keyslot mode
        run: |
          # No AMAIL_ENCRYPTION_KEY or AMAIL_ACCESS_TOKEN: the container starts
          # locked, is provisioned once, and the returned token unlocks it.
          # Density flags (LOG_LEVEL, heap, threadpool, poll) are image defaults
          # in keyslot mode, so this boot must not pass them.
          docker volume create amail-keyslot-ci >/dev/null
          docker run --detach --name amail-keyslot-ci --read-only --user 10001:10001 \
            --tmpfs /tmp --volume amail-keyslot-ci:/data --publish 127.0.0.1:3081:3000 \
            --env AMAIL_KEY_MODE=keyslot --env AMAIL_PROVISION_SECRET=ci-provision-secret-0123456789 \
            --env HOST=0.0.0.0 --env PORT=3000 \
            "${COMPOSE_PROJECT_NAME}:local"
          for _ in $(seq 1 30); do
            curl --silent --fail --max-time 5 http://127.0.0.1:3081/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          locked=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3081/api/health)
          printf '%s\n' "$locked" | grep -q '"keyMode":"keyslot"'
          printf '%s\n' "$locked" | grep -q '"locked":true'
          printf '%s\n' "$locked" | grep -q '"initialized":false'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 -X POST http://127.0.0.1:3081/api/keyslots/init)
          test "$status" = "401"
          init=$(curl --fail --silent --show-error --max-time 10 -X POST \
            -H 'Authorization: Bearer ci-provision-secret-0123456789' http://127.0.0.1:3081/api/keyslots/init)
          token=$(printf '%s' "$init" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).token))')
          unlocked=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3081/api/health)
          printf '%s\n' "$unlocked" | grep -q '"locked":false'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1:3081/api/accounts)
          test "$status" = "401"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer $token" http://127.0.0.1:3081/api/accounts)
          test "$status" = "200"
          # A restart without escrow comes back locked, and the token unlocks it again.
          docker restart amail-keyslot-ci >/dev/null
          for _ in $(seq 1 30); do
            curl --silent --fail --max-time 5 http://127.0.0.1:3081/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3081/api/health | grep -q '"locked":true'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer $token" http://127.0.0.1:3081/api/accounts)
          test "$status" = "200"
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3081/api/health | grep -q '"locked":false'
          # Image defaults: V8 heap, libuv pool, and no per-request log lines.
          docker exec amail-keyslot-ci sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -qx 'NODE_OPTIONS=--max-old-space-size=384'
          docker exec amail-keyslot-ci sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -qx 'UV_THREADPOOL_SIZE=2'
          if docker logs amail-keyslot-ci 2>&1 | grep -q '"url":"/api/health"'; then
            echo 'keyslot boot logged a health request; LOG_LEVEL=error should silence pino-http' >&2
            exit 1
          fi

      - name: Remove ephemeral CI containers and volumes
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env --profile privacy down --volumes --timeout 15
          fi
          docker rm --force --volumes amail-keyslot-ci >/dev/null 2>&1 || true
          docker volume rm amail-keyslot-ci >/dev/null 2>&1 || true

  # Deployments watch the `release` branch, not `main`: it only ever moves to a
  # commit the job above has fully verified. The push is fast-forward only, so
  # a slower run for an older commit can never move it backwards.
  promote:
    name: Promote the tested commit to release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fast-forward release to this commit
        run: git push origin "HEAD:refs/heads/release"
