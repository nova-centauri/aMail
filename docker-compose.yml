name: ${COMPOSE_PROJECT_NAME:-amail}

services:
  amail:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-amail}:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Docker forwards to the container network interface; host exposure is
      # still restricted by the loopback-only `ports` mapping below.
      HOST: 0.0.0.0
      PORT: "3000"
      AMAIL_DATA_DIR: /data
      AMAIL_STATIC_DIR: /app/dist
      # Optional: set by your deploy tooling so /api/health can report which
      # exact revision is serving traffic.
      AMAIL_RELEASE_SHA: ${AMAIL_RELEASE_SHA:-}
      # Typesense is the relevance index. It is not published on the host.
      # Encrypted databases stay on SQLite FTS unless AMAIL_SEARCH_ENGINE=typesense.
      AMAIL_SEARCH_ENGINE: ${AMAIL_SEARCH_ENGINE:-auto}
      AMAIL_TYPESENSE_URL: http://typesense:8108
      AMAIL_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-amail-dev-typesense-key}
      # The privacy launcher provides this only for its own Compose invocation.
      # An empty value keeps remote-content requests on their normal path.
      REMOTE_CONTENT_PROXY_URL: ${REMOTE_CONTENT_PROXY_URL:-}
      # Keep SQLite/FTS temp files on the writable data volume. The container
      # root is read-only and /tmp is a small tmpfs.
      SQLITE_TMPDIR: /data/tmp
    ports:
      # Deliberately local-only. Use an SSH tunnel or an authenticated reverse
      # proxy instead of publishing a mail client directly to the internet.
      - "${AMAIL_BIND_ADDRESS:-127.0.0.1}:${AMAIL_PORT:-3080}:3000"
    volumes:
      - amail-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # A 21-account mailbox measured about 1.1 GiB at steady state. The cap
    # keeps one runaway instance from starving the host; raise it in .env for
    # very large mailboxes.
    mem_limit: ${AMAIL_MEMORY_LIMIT:-1536m}
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # aMail needs direct provider access for IMAP/SMTP. Explicit gateway
      # priority prevents the internal privacy network from becoming its
      # default route on hosts that attach Compose networks in another order.
      app-net:
        gw_priority: 1
      privacy-net:
    depends_on:
      typesense:
        condition: service_started
    labels:
      # Used only with `--profile autoheal`. Default false: autoheal will not
      # restart this container unless you opt in.
      autoheal: ${AMAIL_AUTOHEAL:-false}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Relevance index for the local cache. No host port: only aMail can reach it.
  # The volume is plaintext. With AMAIL_ENCRYPT_DATABASE or keyslot mode, aMail
  # leaves this service unused unless AMAIL_SEARCH_ENGINE=typesense.
  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    init: true
    command:
      - --data-dir
      - /data
      - --api-key=${TYPESENSE_API_KEY:-amail-dev-typesense-key}
    volumes:
      - typesense-data:/data
    mem_limit: ${TYPESENSE_MEMORY_LIMIT:-768m}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app-net
    # The published image is Ubuntu plus the server binary and CA certs. It has
    # bash, not curl, so a curl healthcheck never becomes healthy.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"ok\":true" <&3'
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

  # This has no host port. Start it only with --profile privacy and set
  # REMOTE_CONTENT_PROXY_URL=http://tor-proxy:8118 for that same command.
  # IMAP/SMTP never use it. aMail does not depends_on this service; if Tor
  # cannot bootstrap (stuck at loading_descriptors), mail still works and
  # remote images fail closed without blocking the event loop.
  tor-proxy:
    profiles:
      - privacy
    build:
      context: ./deploy/tor
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-amail}-tor-proxy:local
    restart: unless-stopped
    init: true
    read_only: true
    user: "10002:10002"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - tor-state:/var/lib/tor
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: ${AMAIL_TOR_MEMORY_LIMIT:-256m}
    networks:
      privacy-net:
      # Tor must use the egress bridge as its default route. Without an
      # explicit priority Docker may select the internal network instead,
      # leaving Tor alive but permanently stuck at 0% bootstrap.
      tor-egress:
        gw_priority: 1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          nc -z -w 3 127.0.0.1 8118 &&
          printf 'AUTHENTICATE ""\r\nGETINFO status/bootstrap-phase\r\nQUIT\r\n' |
          nc -w 3 127.0.0.1 9051 |
          grep -q 'PROGRESS=100'
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 12

  # Opt-in. Restarts containers whose Docker HEALTHCHECK is unhealthy.
  # Enable with:
  #   AMAIL_AUTOHEAL=true docker compose --profile autoheal up -d
  # Roll back with:
  #   docker compose --profile autoheal stop socket-proxy autoheal
  #   docker compose --profile autoheal rm -f socket-proxy autoheal
  # aMail IMAP/SMTP do not need this. The Docker socket is still
  # root-equivalent: only socket-proxy mounts it, read-only, and autoheal
  # reaches Docker over TCP on the internal autoheal-net. The mounted
  # HAProxy config allows list and restart (plus /_ping and /version) and
  # returns 403 for everything else, including inspect (Config.Env). Leave
  # the profile off unless you accept that remaining trust boundary.
  # autoheal depends_on socket-proxy: a `docker compose up --no-deps`
  # command must name socket-proxy explicitly or the TCP endpoint is gone.
  socket-proxy:
    profiles:
      - autoheal
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    init: true
    # The published image runs as root so it can connect to the host socket.
    # cap_drop does not remove that socket power; the allowlist does.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AMAIL_SOCKET_PROXY_MEMORY_LIMIT:-64m}
    environment:
      LOG_LEVEL: warning
      DISABLE_IPV6: "1"
      # Fallback if the allowlist overlay is missing. POST=1 is required for
      # restart on this image (ALLOW_RESTARTS is evaluated after the POST
      # block), which would also permit create/stop/exec. The mounted
      # haproxy.cfg.template is the real gate.
      CONTAINERS: "1"
      POST: "1"
      ALLOW_RESTARTS: "1"
      PING: "1"
      VERSION: "1"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/autoheal/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - autoheal-net

  autoheal:
    profiles:
      - autoheal
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AMAIL_AUTOHEAL_MEMORY_LIMIT:-32m}
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: ${AUTOHEAL_INTERVAL:-10}
      AUTOHEAL_START_PERIOD: ${AUTOHEAL_START_PERIOD:-60}
      # Documented TCP setting. willfarrell/autoheal:1.2.0's bundled
      # entrypoint rewrites tcp:// to https:// and also requires
      # DOCKER_SOCK to exist as a file, so we overlay deploy/autoheal's
      # entrypoint (plain HTTP, same monitor loop).
      DOCKER_SOCK: tcp://socket-proxy:2375
    volumes:
      - ./deploy/autoheal/docker-entrypoint:/docker-entrypoint:ro
    depends_on:
      - socket-proxy
    networks:
      - autoheal-net

volumes:
  # Upgrading from GigaMail? Point this at your existing volume instead:
  #   amail-data:
  #     external: true
  #     name: gigamail_gigamail-data
  # aMail opens an existing gigamail.sqlite in place.
  amail-data:
  typesense-data:
  tor-state:

networks:
  # aMail needs ordinary egress for IMAP/SMTP providers.
  app-net:
    driver: bridge
  # Only aMail and Tor/Privoxy share this isolated network.
  privacy-net:
    driver: bridge
    internal: true
  # Tor needs internet egress, but aMail is never attached to this network.
  tor-egress:
    driver: bridge
  # Only socket-proxy and autoheal. No host ports, no app-net/privacy-net,
  # no egress. Compromising autoheal still cannot reach the Docker socket
  # except through the restart-only TCP allowlist.
  autoheal-net:
    driver: bridge
    internal: true
