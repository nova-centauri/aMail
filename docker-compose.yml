name: ${COMPOSE_PROJECT_NAME:-amail}

services:
  amail:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-amail}:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Docker forwards to the container network interface; host exposure is
      # still restricted by the loopback-only `ports` mapping below.
      HOST: 0.0.0.0
      PORT: "3000"
      AMAIL_DATA_DIR: /data
      AMAIL_STATIC_DIR: /app/dist
      # Optional: set by your deploy tooling so /api/health can report which
      # exact revision is serving traffic.
      AMAIL_RELEASE_SHA: ${AMAIL_RELEASE_SHA:-}
      # The privacy launcher provides this only for its own Compose invocation.
      # An empty value keeps remote-content requests on their normal path.
      REMOTE_CONTENT_PROXY_URL: ${REMOTE_CONTENT_PROXY_URL:-}
      # Keep SQLite/FTS temp files on the writable data volume. The container
      # root is read-only and /tmp is a small tmpfs.
      SQLITE_TMPDIR: /data/tmp
    ports:
      # Deliberately local-only. Use an SSH tunnel or an authenticated reverse
      # proxy instead of publishing a mail client directly to the internet.
      - "${AMAIL_BIND_ADDRESS:-127.0.0.1}:${AMAIL_PORT:-3080}:3000"
    volumes:
      - amail-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # A 21-account mailbox measured about 1.1 GiB at steady state. The cap
    # keeps one runaway instance from starving the host; raise it in .env for
    # very large mailboxes.
    mem_limit: ${AMAIL_MEMORY_LIMIT:-1536m}
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # aMail needs direct provider access for IMAP/SMTP. Explicit gateway
      # priority prevents the internal privacy network from becoming its
      # default route on hosts that attach Compose networks in another order.
      app-net:
        gw_priority: 1
      privacy-net:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # This has no host port. Start it only with --profile privacy and set
  # REMOTE_CONTENT_PROXY_URL=http://tor-proxy:8118 for that same command.
  tor-proxy:
    profiles:
      - privacy
    build:
      context: ./deploy/tor
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-amail}-tor-proxy:local
    restart: unless-stopped
    init: true
    read_only: true
    user: "10002:10002"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - tor-state:/var/lib/tor
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: ${AMAIL_TOR_MEMORY_LIMIT:-256m}
    networks:
      privacy-net:
      # Tor must use the egress bridge as its default route. Without an
      # explicit priority Docker may select the internal network instead,
      # leaving Tor alive but permanently stuck at 0% bootstrap.
      tor-egress:
        gw_priority: 1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          nc -z -w 3 127.0.0.1 8118 &&
          printf 'AUTHENTICATE\r\nGETINFO status/bootstrap-phase\r\nQUIT\r\n' |
          nc -w 3 127.0.0.1 9051 |
          grep -q 'PROGRESS=100'
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 12

volumes:
  # Upgrading from GigaMail? Point this at your existing volume instead:
  #   amail-data:
  #     external: true
  #     name: gigamail_gigamail-data
  # aMail opens an existing gigamail.sqlite in place.
  amail-data:
  tor-state:

networks:
  # aMail needs ordinary egress for IMAP/SMTP providers.
  app-net:
    driver: bridge
  # Only aMail and Tor/Privoxy share this isolated network.
  privacy-net:
    driver: bridge
    internal: true
  # Tor needs internet egress, but aMail is never attached to this network.
  tor-egress:
    driver: bridge
